<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>tuto</title>
<style>
:root{--bg:#141519;--win:#1f2127;--win2:#272a31;--line:#363a44;--fg:#e9e6df;--muted:#9aa0ab;--acc:#3f8f2a;--acc2:#56b33a;--blue:#3b82f6;--cop:#d98a4a}
*{box-sizing:border-box}
html,body{margin:0;width:960px;height:540px;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%,#22252d,#121317);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif}
.stage{position:absolute;inset:0}
.top{position:absolute;left:24px;top:18px;display:flex;gap:10px;align-items:center;font:600 13px Inter;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.top b{color:var(--fg);letter-spacing:0;text-transform:none;font-size:15px}
.top i{width:22px;height:22px;background:linear-gradient(135deg,#c86a32,#e7a35d);border:2px solid #8a4a20;display:block}
.cap{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-width:820px;width:max-content;background:rgba(10,11,14,.92);border:1px solid #3a3f4a;border-left:4px solid var(--acc2);padding:10px 18px;font:500 18px/1.35 Inter;border-radius:3px;opacity:0;transition:opacity .35s;z-index:50}
.cap.on{opacity:1}
.cap .n{color:var(--acc2);font-weight:800;margin-right:8px}
.win{position:absolute;background:var(--win);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;opacity:0;transform:scale(.97) translateY(8px);transition:opacity .35s,transform .35s}
.win.on{opacity:1;transform:none}
.bar{height:32px;background:#17181c;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font:600 12.5px Inter;color:var(--muted)}
.bar .dots{margin-left:auto;letter-spacing:3px}
.url{flex:1;background:#24262c;border-radius:5px;padding:4px 10px;color:#cfd3da;font:500 12.5px "DejaVu Sans Mono",monospace;max-width:420px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#3a3d44;border:2px solid #555a63;border-bottom-color:#25272c;color:#fff;font:600 14px Inter;border-radius:3px;transition:filter .15s,transform .1s}
.btn.g{background:var(--acc);border-color:#5fbf45;border-bottom-color:#25521a}
.btn.b{background:#2463d9;border-color:#5b8ff0;border-bottom-color:#173f8c}
.btn.hl{filter:brightness(1.25)}
.btn.pr{transform:translateY(1px);filter:brightness(.9)}
.row{display:flex;gap:10px;align-items:center}
.cursor{position:absolute;left:480px;top:300px;width:22px;height:28px;z-index:60;transition:left .7s cubic-bezier(.45,.05,.3,1),top .7s cubic-bezier(.45,.05,.3,1);pointer-events:none}
.ripple{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #fff;z-index:59;animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{width:44px;height:44px;margin:-22px 0 0 -22px;opacity:0}}
.hide{display:none!important}
.fade{opacity:0;transition:opacity .3s}.fade.on{opacity:1}
.pbar{height:8px;background:#30333b;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--acc2);transition:width 2.2s linear}
.chip{display:inline-flex;gap:8px;align-items:center;background:#24272e;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:500 13px Inter}
.chip::before{content:"";width:14px;height:16px;background:#c9a24a;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,0 100%)}
.field{background:#15161a;border:1px solid #444955;border-radius:4px;padding:8px 10px;font:500 14px "DejaVu Sans Mono",monospace;min-height:36px;color:#fff}
.field.focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.3)}
.lbl{font:600 11.5px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
.list div{padding:7px 10px;border-radius:4px;font:500 13.5px Inter;color:#cfd3da}
.list div.sel{background:#2f4f86;color:#fff}
.folder{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;font:500 14px Inter}
.folder::before{content:"";width:20px;height:15px;background:#d8a93c;border-radius:2px;box-shadow:inset 0 3px 0 #f0c45a}
.folder.file::before{background:#8b97a8;box-shadow:none;width:15px;height:18px}
.folder.sel{background:#2f4f86}
.ghost{position:absolute;z-index:58;background:rgba(47,79,134,.85);border:1px solid #6d93d6;border-radius:5px;padding:6px 10px;font:600 13px Inter;transition:left .9s ease-in-out,top .9s ease-in-out;opacity:0}
.mc{font-family:"DejaVu Sans Mono",monospace;text-shadow:2px 2px 0 #3f3f3f}
.mcbtn{width:400px;height:40px;display:grid;place-items:center;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 #a9a9a9,inset -2px -3px 0 #4d4d4d;color:#fff;font:600 16px "DejaVu Sans Mono",monospace;text-shadow:2px 2px 0 #3f3f3f}
.mcbtn.hl{background:#7b86c2;box-shadow:inset 2px 2px 0 #b5bee8,inset -2px -3px 0 #4c5590;color:#ffffa0}
.dirt{background-color:#3b2a1d;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),repeating-conic-gradient(#6b4a31 0 25%,#5a3d28 0 50%);background-size:auto,32px 32px}
.slider{position:relative;height:6px;background:#3a3d45;border-radius:3px;width:320px}.slider i{position:absolute;left:0;top:0;bottom:0;width:25%;background:var(--blue);border-radius:3px;transition:width 1s}.slider b{position:absolute;top:-6px;left:25%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;transition:left 1s}
.check{color:#5fd36b;font-weight:800}
</style></head><body>
<div class="stage" id="st"></div>
<div class="top"><i></i><b>Pack WIP</b><span id="ttl"></span></div>
<div class="cap" id="cap"></div>
<svg class="cursor" id="cur" viewBox="0 0 22 28"><path d="M1 1v22l6-6 4 9 4-2-4-9h8z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>
<script>
const $=s=>document.querySelector(s), st=$('#st'), cur=$('#cur');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let n=0;
async function cap(t){const c=$('#cap');c.classList.remove('on');await wait(250);c.innerHTML=`<span class="n">${++n}.</span>${t}`;c.classList.add('on');await wait(350)}
function at(sel,dx=0,dy=0){const r=$(sel).getBoundingClientRect();return [r.left+r.width/2+dx,r.top+r.height/2+dy]}
async function move(sel,dx,dy){const [x,y]=at(sel,dx,dy);cur.style.left=(x-3)+'px';cur.style.top=(y-2)+'px';await wait(800)}
async function click(sel,dx,dy){await move(sel,dx,dy);const e=$(sel);e.classList.add('hl');await wait(150);e.classList.add('pr');const [x,y]=at(sel,dx,dy);const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';document.body.append(r);setTimeout(()=>r.remove(),600);await wait(180);e.classList.remove('pr','hl');await wait(250)}
async function type(sel,t,ms=55){const e=$(sel);e.classList.add('focus');for(const ch of t){e.textContent+=ch;await wait(ms)}await wait(250);e.classList.remove('focus')}
function win(id,html,css){const w=document.createElement('div');w.className='win';w.id=id;w.style.cssText=css;w.innerHTML=html;st.append(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('on')));return w}
function close(id){const w=$('#'+id);w.classList.remove('on');setTimeout(()=>w.remove(),400)}
const browser=(id,url,body,css='left:110px;top:58px;width:740px;height:340px')=>win(id,`<div class="bar"><span class="url">${url}</span><span class="dots">•••</span></div><div style="padding:26px 30px">${body}</div>`,css);
const app=(id,name,body,css)=>win(id,`<div class="bar">${name}<span class="dots">•••</span></div>${body}`,css);
const web=(id)=>browser(id,'greciant.github.io/pack-wip/#mods',`<div style="font:700 26px Inter;margin-bottom:6px">Todos los mods</div><div style="color:var(--muted);margin-bottom:20px">304 mods · ZIP con los 298 publicables, ajustes y SPBR</div><div style="display:grid;gap:10px;justify-items:start"><span class="btn g" id="bpack">Bajar el pack completo <small style="opacity:.8">1,0 GB</small></span><span class="btn" id="bcf">Pack para CurseForge <small style="opacity:.7">importable</small></span><div class="pbar fade" id="pb" style="width:340px"><i></i></div><div id="dl"></div></div>`);
async function bajar(btn,file){await click(btn);$('#pb').classList.add('on');await wait(60);$('#pb i').style.width='100%';await wait(2300);$('#pb').classList.remove('on');$('#dl').innerHTML=`<span class="chip">${file}</span>`;await wait(900)}

const V={
async prism(){ $('#ttl').textContent='Instalar Prism y crear la instancia';
  browser('w1','prismlauncher.org/download',`<div style="font:800 30px Inter">Prism Launcher</div><div style="color:var(--muted);margin:6px 0 22px">Launcher libre y de código abierto para Minecraft</div><span class="btn b" id="d1">Descargar para Windows</span><div id="dl" style="margin-top:18px"></div>`);
  await cap('Descarga Prism Launcher desde prismlauncher.org e instálalo.'); await click('#d1'); $('#dl').innerHTML='<span class="chip">PrismLauncher-Windows-Setup.exe</span>'; await wait(1300); close('w1'); await wait(400);
  app('w2','Prism Launcher',`<div class="row" style="padding:10px 12px;border-bottom:1px solid var(--line)"><span class="btn" id="add">+ Añadir instancia</span><span class="btn">Carpetas</span><span class="btn">Ajustes</span></div><div id="insts" style="padding:22px;display:flex;gap:18px;min-height:250px"></div>`,'left:90px;top:70px;width:780px;height:360px');
  await cap('Abre Prism, inicia sesión con tu cuenta de Microsoft y pulsa «Añadir instancia».'); await wait(500); await click('#add');
  app('w3','Nueva instancia',`<div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:18px"><div><div class="lbl">Nombre</div><div class="field" id="nm"></div><div class="lbl">Versión de Minecraft</div><div class="list"><div>1.21.1</div><div>1.20.4</div><div id="v120">1.20.1</div><div>1.19.2</div></div></div><div><div class="lbl">Cargador de mods</div><div class="list"><div>Ninguno</div><div>NeoForge</div><div id="forge">Forge</div><div>Fabric</div></div><div class="lbl">Versión de Forge</div><div class="field" id="fv"></div><div style="margin-top:16px;text-align:right"><span class="btn g" id="ok">Aceptar</span></div></div></div>`,'left:200px;top:95px;width:560px;height:340px');
  await wait(500); await cap('Ponle de nombre WIP y elige Minecraft 1.20.1.'); await click('#nm'); await type('#nm','WIP'); await click('#v120'); $('#v120').classList.add('sel'); await wait(400);
  await cap('En «Cargador de mods» elige Forge, versión 47.4.23, y acepta.'); await click('#forge'); $('#forge').classList.add('sel'); await click('#fv'); await type('#fv','47.4.23',70); await click('#ok'); close('w3'); await wait(500);
  $('#insts').innerHTML='<div style="width:120px;text-align:center"><div style="width:72px;height:72px;margin:0 auto 8px;background:linear-gradient(135deg,#c86a32,#e7a35d);border:3px solid #8a4a20"></div><b>WIP</b><div style="color:var(--muted);font-size:12px">Forge 1.20.1</div></div>';
  await cap('Listo: tu instancia WIP aparece en Prism. Si pide Java 17, deja que lo descargue.'); await move('#insts',-300,0); await wait(2600);
},
async pack(){ $('#ttl').textContent='Instalar el pack';
  web('w1'); await cap('En la sección Mods de la web, pulsa «Bajar el pack completo» y espera a que termine.'); await bajar('#bpack','pack-wip-cliente-1.20.1.zip'); close('w1'); await wait(400);
  app('w2','Prism Launcher',`<div style="display:flex;height:328px"><div style="flex:1;padding:22px"><div style="width:120px;text-align:center;padding:10px;border-radius:6px" id="inst"><div style="width:72px;height:72px;margin:0 auto 8px;background:linear-gradient(135deg,#c86a32,#e7a35d);border:3px solid #8a4a20"></div><b>WIP</b></div></div><div style="width:200px;border-left:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start"><span class="btn g">Jugar</span><span class="btn" id="edit">Editar</span><span class="btn" id="fold">Carpeta</span></div></div>`,'left:90px;top:70px;width:780px;height:362px');
  await cap('En Prism, selecciona la instancia WIP y pulsa «Carpeta».'); await click('#inst'); $('#inst').style.background='#2f4f86'; await click('#fold');
  app('w3','.minecraft',`<div style="padding:12px" id="mcd"><div class="folder">saves</div><div class="folder">screenshots</div></div>`,'left:500px;top:110px;width:330px;height:300px');
  app('w4','pack-wip-cliente-1.20.1.zip',`<div style="padding:12px"><div class="folder" id="f1">mods</div><div class="folder" id="f2">config</div><div class="folder" id="f3">resourcepacks</div><div class="folder file">LEEME.txt</div></div>`,'left:130px;top:130px;width:330px;height:250px');
  await wait(600); await cap('Abre el ZIP y copia las carpetas mods, config y resourcepacks dentro de .minecraft.');
  await click('#f1'); for(const f of ['#f1','#f2','#f3']) $(f).classList.add('sel'); await wait(400);
  const g=document.createElement('div');g.className='ghost';g.textContent='3 carpetas';const [x,y]=at('#f2');g.style.left=(x-40)+'px';g.style.top=(y-10)+'px';document.body.append(g);g.style.opacity=1;await wait(100);
  const [tx,ty]=at('#mcd',0,40);g.style.left=(tx-40)+'px';g.style.top=(ty-10)+'px';cur.style.left=tx+'px';cur.style.top=ty+'px';await wait(1000);g.remove();
  $('#mcd').insertAdjacentHTML('afterbegin','<div class="folder">config</div><div class="folder">mods</div><div class="folder">resourcepacks</div>'); await wait(1000); close('w3'); close('w4'); await wait(500);
  await cap('Pulsa «Editar» → Ajustes → Java y sube la memoria máxima a 8 GB (8192 MB).'); await click('#edit');
  app('w5','Editar instancia · Ajustes',`<div style="padding:24px"><div class="lbl">Memoria máxima</div><div class="row" style="gap:18px"><div class="slider" id="sl"><i></i><b></b></div><div class="field" id="mem" style="width:120px">4096 MB</div></div><div style="margin-top:28px;text-align:right"><span class="btn g" id="cl">Cerrar</span></div></div>`,'left:230px;top:140px;width:500px;height:220px');
  await wait(500); await move('#sl',-120,0); $('#sl i').style.width='50%'; $('#sl b').style.left='50%'; const [sx,sy]=at('#sl'); cur.style.left=sx+'px'; await wait(1000); $('#mem').textContent='8192 MB'; await wait(500); await click('#cl'); close('w5');
  await cap('¡Listo! Pulsa «Jugar». La primera carga tarda unos minutos.'); await wait(2600);
},
async curseforge(){ $('#ttl').textContent='Importar en CurseForge';
  web('w1'); await cap('Si usas la app de CurseForge, pulsa «Pack para CurseForge» en la web.'); await bajar('#bcf','pack-wip-curseforge-1.20.1.zip'); close('w1'); await wait(400);
  app('w2','CurseForge',`<div style="display:flex;height:328px"><div style="width:150px;background:#18191d;padding:14px;display:grid;gap:6px;align-content:start;font:600 13px Inter;color:var(--muted)"><div style="color:#f16436">Minecraft</div><div>Descubrir</div><div>Ajustes</div></div><div style="flex:1;padding:22px"><div class="row" style="justify-content:space-between"><b style="font-size:18px">Mis modpacks</b><span class="btn" id="new" style="background:#f16436;border-color:#ff8a63;border-bottom-color:#9b3418">+ Crear perfil personalizado</span></div><div id="prof" style="margin-top:22px"></div></div></div>`,'left:90px;top:70px;width:780px;height:362px');
  await cap('En la app: Minecraft → «Crear perfil personalizado».'); await click('#new');
  app('w3','Crear perfil personalizado',`<div style="padding:20px"><div style="color:var(--muted)">¿Ya tienes un perfil exportado? <b id="imp" style="color:#f16436;text-decoration:underline">Importar</b></div><div class="lbl">Archivo</div><div class="field" id="fz"></div><div style="margin-top:18px;text-align:right"><span class="btn" id="go" style="background:#f16436;border-color:#ff8a63;border-bottom-color:#9b3418">Importar</span></div></div>`,'left:250px;top:130px;width:460px;height:220px');
  await wait(500); await cap('Pulsa «Importar» y elige el ZIP que bajaste.'); await click('#imp'); await type('#fz','pack-wip-curseforge-1.20.1.zip',30); await click('#go'); close('w3'); await wait(400);
  $('#prof').innerHTML='<div class="row" style="gap:14px;background:#24262c;border:1px solid var(--line);border-radius:6px;padding:12px"><div style="width:52px;height:52px;background:linear-gradient(135deg,#c86a32,#e7a35d);border:3px solid #8a4a20"></div><div style="flex:1"><b>Pack WIP</b><div style="color:var(--muted);font-size:12.5px">Forge 47.4.23 · 1.20.1</div><div class="pbar" style="margin-top:8px"><i id="ip"></i></div></div><span class="btn g" id="pl">Jugar</span></div>';
  await cap('CurseForge instala Forge y copia los mods. Cuando termine, pulsa «Jugar».'); await wait(100); $('#ip').style.width='100%'; await wait(2400); await click('#pl'); await wait(1600);
},
async tailscale(){ $('#ttl').textContent='Conectar Tailscale';
  browser('w1','tailscale.com/download',`<div style="font:800 30px Inter">Tailscale</div><div style="color:var(--muted);margin:6px 0 22px">Red privada gratis para uso personal</div><span class="btn b" id="d1">Descargar Tailscale</span><div id="dl" style="margin-top:18px"></div>`);
  await cap('Descarga Tailscale desde tailscale.com/download e instálalo.'); await click('#d1'); $('#dl').innerHTML='<span class="chip">tailscale-setup.exe</span>'; await wait(1200); close('w1'); await wait(400);
  app('w2','Tailscale',`<div style="padding:24px;text-align:center" id="ts"><div style="font:700 18px Inter;margin-bottom:6px">Desconectado</div><div style="color:var(--muted);margin-bottom:18px">Inicia sesión para unirte a tu red</div><span class="btn b" id="login">Iniciar sesión</span></div>`,'left:330px;top:90px;width:300px;height:230px');
  await cap('Abre Tailscale e inicia sesión con tu propia cuenta (Google, Microsoft o GitHub).'); await click('#login'); await wait(500);
  $('#ts').innerHTML='<div style="font:700 18px Inter;margin-bottom:6px"><span class="check">●</span> Conectado</div><div style="color:var(--muted)">tu-pc · 100.x.x.x</div>'; await wait(1400); close('w2'); await wait(400);
  browser('w3','login.tailscale.com/admin/invite',`<div style="font:700 22px Inter;margin-bottom:8px">Benjamin compartió un equipo contigo</div><div style="color:var(--muted);margin-bottom:20px">Servidor WIP · acceso al puerto de Minecraft</div><span class="btn g" id="acc">Aceptar invitación</span><div id="ok" style="margin-top:20px"></div>`);
  await cap('Abre el enlace de invitación que te mandé por Discord y acéptalo.'); await click('#acc');
  $('#ok').innerHTML='<div class="row" style="gap:12px;background:#24262c;border:1px solid var(--line);border-radius:6px;padding:12px 14px"><span class="check">●</span><b>Servidor WIP</b><span style="color:var(--muted);font-family:DejaVu Sans Mono,monospace">100.101.205.117</span><span style="margin-left:auto;color:#5fd36b">Compartido</span></div>';
  await cap('El servidor aparece en tu Tailscale. Déjalo conectado cada vez que vayas a jugar.'); await wait(2800);
},
async servidor(){ $('#ttl').textContent='Entrar al servidor';
  browser('w1','greciant.github.io/pack-wip/#servidor',`<div class="lbl">IP privada del servidor</div><div class="row" style="background:#15161a;border:1px solid var(--line);padding:12px 14px;border-radius:4px"><code style="font:500 20px DejaVu Sans Mono,monospace;flex:1">100.101.205.117:25567</code><span class="btn" id="cp">Copiar</span></div><div id="cpok" style="margin-top:12px;color:#5fd36b"></div>`);
  await cap('Con Tailscale conectado, copia la dirección del servidor desde la web.'); await click('#cp'); $('#cpok').textContent='✓ Copiado'; await wait(900); close('w1'); await wait(400);
  win('w2',`<div class="dirt" style="position:absolute;inset:0;display:grid;place-items:center"><div style="display:grid;gap:10px;justify-items:center" id="menu"><div class="mc" style="font:800 40px DejaVu Sans Mono,monospace;color:#e8e8e8;margin-bottom:18px">MINECRAFT</div><div class="mcbtn">Un jugador</div><div class="mcbtn" id="mp">Multijugador</div><div class="mcbtn">Opciones…</div></div></div>`,'left:80px;top:60px;width:800px;height:390px');
  await cap('Abre el juego desde Prism y entra a «Multijugador».'); await wait(400); await click('#mp');
  $('#menu').innerHTML='<div class="mc" style="color:#fff;font-size:17px;margin-bottom:8px">Jugar en línea</div><div id="srv" style="width:520px;min-height:120px;background:rgba(0,0,0,.5);border:1px solid #777;padding:10px"></div><div class="row" style="margin-top:8px"><div class="mcbtn" style="width:256px" id="add">Añadir servidor</div><div class="mcbtn" style="width:256px" id="join">Unirse al servidor</div></div>';
  await cap('Pulsa «Añadir servidor».'); await click('#add');
  $('#menu').innerHTML='<div class="mc" style="color:#fff;font-size:17px">Editar información del servidor</div><div class="mc" style="color:#aaa;font-size:14px;margin-top:10px;justify-self:start">Nombre del servidor</div><div class="field" id="sn" style="width:400px;background:#000;border:2px solid #a0a0a0;border-radius:0"></div><div class="mc" style="color:#aaa;font-size:14px;justify-self:start">Dirección del servidor</div><div class="field" id="sa" style="width:400px;background:#000;border:2px solid #a0a0a0;border-radius:0"></div><div class="mcbtn" id="done" style="margin-top:12px">Listo</div>';
  await cap('Ponle un nombre, pega la dirección (Ctrl+V) y pulsa «Listo».'); await click('#sn'); await type('#sn','Servidor WIP'); await click('#sa'); await wait(300); $('#sa').textContent='100.101.205.117:25567'; await wait(700); await click('#done');
